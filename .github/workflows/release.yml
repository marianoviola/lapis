name: Version build and Marketplace publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v0.1.1)'
        required: true
        type: string
      publish:
        description: Publish this version to the VS Code Marketplace
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected a stable release tag such as v0.1.1"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Validate manifest
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          if (`v${manifest.version}` !== process.env.RELEASE_TAG) {
            throw new Error('Release tag must match package.json version');
          }
          if (manifest.publisher !== 'marianoviola' || manifest.name !== 'lapis') {
            throw new Error('Unexpected extension identity');
          }
          const icon = readFileSync(manifest.icon);
          if (icon.subarray(0, 8).toString('hex') !== '89504e470d0a1a0a'
              || icon.readUInt32BE(16) > 1024 || icon.readUInt32BE(20) > 1024) {
            throw new Error('Expected a PNG icon no larger than 1024 x 1024');
          }
          JS
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --maxWorkers=2
      - name: Package VSIX (includes type-check, lint and production build)
        run: pnpm dlx @vscode/vsce@4.0.0 package --no-dependencies --out lapis.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: lapis-${{ inputs.tag || github.ref_name }}
          path: lapis.vsix
          if-no-files-found: error

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lapis-${{ github.ref_name }}
      - name: Create GitHub release and attach VSIX
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mv lapis.vsix "lapis-${RELEASE_TAG#v}.vsix"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "lapis-${RELEASE_TAG#v}.vsix"
          else
            gh release create "$RELEASE_TAG" "lapis-${RELEASE_TAG#v}.vsix" \
              --verify-tag --title "Lapis $RELEASE_TAG" --generate-notes
          fi

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lapis-${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish the built VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [[ -z "$VSCE_PAT" ]]; then
            echo "::error::Configure the repository Actions secret VSCE_PAT first"
            exit 1
          fi
          npx --yes @vscode/vsce@4.0.0 publish --packagePath lapis.vsix
